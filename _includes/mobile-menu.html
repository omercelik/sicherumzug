<div id="mobile-menu" class="fixed inset-0 z-50 hidden flex-col bg-white text-[#0b1f3a] lg:hidden" data-mobile-menu>
  <div class="flex items-center justify-between gap-4 border-b border-[#e2e8f0] px-4 py-3">
    <a href="{{ '/' | relative_url }}" class="flex items-center gap-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#ea580c] rounded-lg">
      <span class="sr-only">{{ site.brand_name }}</span>
      <span class="font-semibold tracking-tight text-[#0b1f3a] flex items-center gap-2">
        <span>sicher team</span>
        {% include svg/box_logo.svg class="w-6 h-5 shrink-0" %}
      </span>
    </a>
    <button id="mobile-menu-close" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[#f1f5f9] text-[#0b1f3a] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#ea580c] transition-opacity" onclick="mobileMenuToggle()" aria-label="Menü schließen">
      {% include svg/close.svg class="w-[18px] h-[18px] shrink-0 fill-current" %}
    </button>
  </div>
  <div class="flex-1 overflow-y-auto px-5 py-5 space-y-1">
    <a class="block border-b border-[#e2e8f0] py-3.5 text-base font-semibold text-[#0b1f3a] hover:text-[#ea580c]" href="{{ '/leistungen/' | relative_url }}" onclick="mobileMenuToggle()">Leistungen</a>
    <a class="block border-b border-[#e2e8f0] py-3.5 text-base font-semibold text-[#0b1f3a] hover:text-[#ea580c]" href="{{ '/bezirke/' | relative_url }}" onclick="mobileMenuToggle()">Einsatzgebiete</a>
    <a class="block border-b border-[#e2e8f0] py-3.5 text-base font-semibold text-[#0b1f3a] hover:text-[#ea580c]" href="{{ '/preise/' | relative_url }}" onclick="mobileMenuToggle()">Ablauf &amp; Preise</a>
    <a class="block border-b border-[#e2e8f0] py-3.5 text-base font-semibold text-[#0b1f3a] hover:text-[#ea580c]" href="{{ '/ratgeber/' | relative_url }}" onclick="mobileMenuToggle()">Ratgeber</a>
    <a class="block border-b border-[#e2e8f0] py-3.5 text-base font-semibold text-[#0b1f3a] hover:text-[#ea580c]" href="{{ '/ablauf/' | relative_url }}" onclick="mobileMenuToggle()">Ablauf im Detail</a>
    <a class="block border-b border-[#e2e8f0] py-3.5 text-base font-semibold text-[#0b1f3a] hover:text-[#ea580c]" href="{{ '/ueber-uns/' | relative_url }}" onclick="mobileMenuToggle()">Über Uns</a>
  </div>
  <div class="border-t border-[#e2e8f0] p-5 bg-[#f8fafc] space-y-3">
    <a class="btn-primary w-full !rounded-md" href="{{ '/angebot/' | relative_url }}" onclick="mobileMenuToggle()">Angebot anfragen</a>
    <a class="btn-ghost-light w-full text-sm !rounded-md" href="tel:{{ site.phone | replace: ' ', '' }}" onclick="mobileMenuToggle()">{{ site.phone }}</a>
  </div>
</div>
