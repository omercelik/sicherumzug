<section class="relative bg-slate-950 text-white min-h-[40vh] flex flex-col pt-24 pb-12 hero-grid hero-glow">
  <div class="absolute inset-0 z-0 bg-slate-950/50 backdrop-blur-[1px]"></div>
  <div class="container relative z-20 mx-auto px-4 md:px-6 h-full flex flex-col justify-center">
    {% include breadcrumbs.html %}
    <div class="mt-8 max-w-4xl">
      <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight" data-hero-heading>{{ page.title }}</h1>
      {% if page.description %}
      <p class="mt-4 text-lg text-slate-300">{{ page.description | strip_html | truncate: 160 }}</p>
      {% endif %}
    </div>
  </div>
</section>
