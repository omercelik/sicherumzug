<!-- Mobile Sticky Bottom Bar -->
<div class="fixed bottom-0 inset-x-0 z-50 md:hidden no-print" role="navigation" aria-label="Schnellkontakt">
  <div class="sticky-cta-bar p-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] shadow-[0_-12px_30px_-8px_rgba(0,0,0,0.45)] flex gap-2.5">
    <a href="tel:{{ site.phone | replace: ' ', '' }}" class="flex-1 inline-flex items-center justify-center gap-2 min-h-[48px] rounded-xl bg-gradient-to-r from-[#e07830] to-[#9a4a18] text-white font-bold text-[11px] uppercase tracking-wider shadow-lg shadow-[#061a18]/35 active:scale-[0.98] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#f0a060] focus-visible:ring-offset-2 focus-visible:ring-offset-[#061a18] transition-transform">
      {% include svg/call.svg class="w-[18px] h-[18px] shrink-0 fill-current" %}
      <span>Anrufen</span>
    </a>
    <a href="{{ site.whatsapp }}" class="flex-1 inline-flex items-center justify-center gap-2 min-h-[48px] rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-[11px] uppercase tracking-wider shadow-lg shadow-emerald-950/30 active:scale-[0.98] focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-300 focus-visible:ring-offset-2 focus-visible:ring-offset-[#061a18] transition-transform">
      {% include svg/chat.svg class="w-[18px] h-[18px] shrink-0 fill-current" %}
      <span>WhatsApp</span>
    </a>
  </div>
</div>
