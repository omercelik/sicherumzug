<!-- Mobile Sticky Bottom Bar -->
<div class="fixed bottom-0 inset-x-0 z-50 md:hidden no-print" role="navigation" aria-label="Schnellkontakt">
  <div class="sticky-cta-bar p-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] shadow-[0_-8px_24px_-8px_rgba(15,23,42,0.18)] flex gap-2.5">
    <a href="tel:{{ site.phone | replace: ' ', '' }}" class="flex-1 inline-flex items-center justify-center gap-2 min-h-[48px] rounded-xl bg-[color:var(--brand-orange)] hover:bg-[color:var(--brand-orange-hover)] text-white font-bold text-[11px] uppercase tracking-wider shadow-md shadow-orange-500/25 active:scale-[0.98] focus:outline-none focus-visible:ring-2 focus-visible:ring-[color:var(--brand-orange)] focus-visible:ring-offset-2 transition-transform">
      {% include svg/call.svg class="w-[18px] h-[18px] shrink-0 fill-current" %}
      <span>Anrufen</span>
    </a>
    <a href="{{ site.whatsapp }}" class="flex-1 inline-flex items-center justify-center gap-2 min-h-[48px] rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-[11px] uppercase tracking-wider shadow-md shadow-emerald-700/20 active:scale-[0.98] focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400 focus-visible:ring-offset-2 transition-transform">
      {% include svg/chat.svg class="w-[18px] h-[18px] shrink-0 fill-current" %}
      <span>WhatsApp</span>
    </a>
  </div>
</div>
