<!-- Mobile Sticky Bottom Bar (Conversion Engine) -->
<div class="fixed bottom-0 inset-x-0 z-50 md:hidden">

    <!-- Button 1 (Direct Call - Primary) -->
    <a href="tel:{{ site.phone | replace: ' ', '' }}" class="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-slate-950 font-bold rounded-xl py-3.5 px-3 flex-1 flex items-center justify-center gap-2 text-center text-[11px] uppercase tracking-wider shadow-lg shadow-orange-500/20 active:scale-95 transition-all">
      <span class="material-symbols-outlined text-base">call</span>
      <span>JETZT ANRUFEN</span>

    <!-- Button 2 (WhatsApp Photo Quote - Secondary) -->

      <span class="material-symbols-outlined text-base">chat</span>
