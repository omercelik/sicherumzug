<header class="sticky top-0 z-50 site-header shadow-sm">
  <div class="container mx-auto px-4">
    <div class="flex h-16 md:h-[4.25rem] items-center justify-between gap-4">

      <a
        href="{{ '/' | relative_url }}"
        class="flex items-center gap-2.5 rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-[color:var(--brand-orange)] focus-visible:ring-offset-2"
      >
        <span class="sr-only">{{ site.brand_name }}</span>
        <span class="site-logo-wordmark flex items-center gap-2 text-[1.15rem] sm:text-xl font-semibold tracking-tight leading-none whitespace-nowrap text-[#0b1f3a]">
          <span>sicher team</span>
          {% include svg/box_logo.svg class="w-7 h-6 shrink-0 text-[#0b1f3a]" %}
        </span>
      </a>

      <nav class="hidden items-center gap-1 text-[0.95rem] font-medium lg:flex" aria-label="Hauptnavigation">
        <a class="rounded-md px-3 py-2.5 text-[#0b1f3a] hover:text-[#ea580c] transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-[color:var(--brand-orange)]" href="{{ '/leistungen/' | relative_url }}">Leistungen</a>
        <a class="rounded-md px-3 py-2.5 text-[#0b1f3a] hover:text-[#ea580c] transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-[color:var(--brand-orange)]" href="{{ '/bezirke/' | relative_url }}">Einsatzgebiete</a>
        <a class="rounded-md px-3 py-2.5 text-[#0b1f3a] hover:text-[#ea580c] transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-[color:var(--brand-orange)]" href="{{ '/preise/' | relative_url }}">Ablauf &amp; Preise</a>
        <a class="rounded-md px-3 py-2.5 text-[#0b1f3a] hover:text-[#ea580c] transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-[color:var(--brand-orange)]" href="{{ '/ratgeber/' | relative_url }}">Ratgeber</a>

        <a class="ml-3 inline-flex items-center justify-center rounded-md bg-[#ea580c] hover:bg-[#c2410c] text-white font-bold px-5 py-2.5 shadow-md shadow-orange-500/20 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-[color:var(--brand-orange)] focus-visible:ring-offset-2" href="{{ '/angebot/' | relative_url }}">
          Angebot anfragen
        </a>
      </nav>

      <div class="flex items-center gap-2 lg:hidden">
        <a href="tel:{{ site.phone | replace: ' ', '' }}" class="hidden sm:inline-flex items-center justify-center h-10 w-10 rounded-full border border-[#e2e8f0] text-[#0b1f3a] hover:border-[#ea580c] hover:text-[#ea580c] focus:outline-none focus-visible:ring-2 focus-visible:ring-[color:var(--brand-orange)]" aria-label="Anrufen">
          {% include svg/call.svg class="w-[18px] h-[18px] fill-current" %}
        </a>
        <a href="{{ '/angebot/' | relative_url }}" class="hidden sm:inline-flex rounded-md bg-[#ea580c] hover:bg-[#c2410c] text-white text-xs font-bold px-3.5 py-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-[color:var(--brand-orange)]">
          Angebot
        </a>
        <button id="mobile-menu-open" class="inline-flex h-10 w-10 items-center justify-center rounded-full text-[#0b1f3a] bg-[#f1f5f9] hover:bg-[#e2e8f0] active:scale-95 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-[color:var(--brand-orange)]" onclick="mobileMenuToggle()" aria-label="Menü öffnen" aria-expanded="false" aria-controls="mobile-menu">
          <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
      </div>

    </div>
  </div>
</header>
