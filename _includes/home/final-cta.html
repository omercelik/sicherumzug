<section class="relative section-pad defer-section overflow-hidden" id="final-cta">
  <div class="absolute inset-0">
    <img src="{{ '/assets/images/hero/desktop.avif' | relative_url }}" alt="" class="w-full h-full object-cover" width="1632" height="640" loading="lazy" decoding="async"/>
    <div class="absolute inset-0 bg-gradient-to-br from-[#061a18]/94 via-[#0b2f2b]/90 to-[#061a18]/92"></div>
  </div>
  <div class="container relative z-10 mx-auto px-4 md:px-6">
    <div class="max-w-3xl mx-auto text-center">
      <p class="text-[11px] font-bold uppercase tracking-[0.16em] text-[#f0a060]">Nächster Schritt</p>
      <h2 class="mt-3 text-3xl md:text-4xl font-extrabold text-white tracking-tight">Bereit für Ihren Fixpreis?</h2>
      <p class="mt-4 text-base md:text-lg text-[#b9d0cb] leading-relaxed">Kostenlose Besichtigung, schriftliches Angebot, Team das Wien &amp; Österreich kennt.</p>
      <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4">
        <a href="{{ '/angebot/' | relative_url }}" class="btn-primary w-full sm:w-auto min-w-[220px]">Gratis Angebot anfordern</a>
        <a href="{{ site.whatsapp }}" class="btn-ghost-light w-full sm:w-auto">
          <img src="{{ site.images.whatsapp | default: '/WhatsApp.svg' | relative_url }}" alt="" width="16" height="16" class="shrink-0" loading="lazy"/>
          WhatsApp-Foto senden
        </a>
      </div>
      <div class="mt-10 max-w-xl mx-auto text-left form-panel !bg-[#fffdf8] !text-[color:var(--text-primary)] p-6 md:p-8" id="angebot">
        <p class="text-[11px] font-bold uppercase tracking-[0.12em] text-[color:var(--brand-orange-dark)] m-0">Kurzformular</p>
        <h3 class="mt-2 text-xl font-extrabold text-[color:var(--text-primary)] m-0">Kostenlose Ersteinschätzung</h3>
        <p class="mt-2 text-sm text-[color:var(--text-secondary)] m-0">Name, Telefon, PLZ — wir melden uns rasch.</p>
        <div class="mt-5">
          {% include quote-form.html %}
        </div>
      </div>
    </div>
  </div>
</section>
