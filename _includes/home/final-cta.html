<section class="relative section-pad defer-section overflow-hidden bg-[color:var(--surface-soft)] border-t border-[color:var(--border-light)]" id="final-cta">
  <div class="container relative z-10 mx-auto px-4 md:px-6">
    <div class="max-w-3xl mx-auto text-center">
      <p class="text-[11px] font-bold uppercase tracking-[0.16em] text-[color:var(--brand-orange-dark)]">Nächster Schritt</p>
      <h2 class="mt-3 text-3xl md:text-4xl font-extrabold text-[color:var(--text-primary)] tracking-tight">Bereit für Ihren Fixpreis?</h2>
      <p class="mt-4 text-base md:text-lg text-[color:var(--text-secondary)] leading-relaxed">Kostenlose Besichtigung, schriftliches Angebot, Team das Wien &amp; Österreich kennt.</p>
      <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4">
        <a href="{{ '/angebot/' | relative_url }}" class="btn-primary w-full sm:w-auto min-w-[220px]">Gratis Angebot anfordern</a>
        <a href="{{ site.whatsapp }}" class="btn-ghost-light w-full sm:w-auto">
          <img src="{{ site.images.whatsapp | default: '/WhatsApp.svg' | relative_url }}" alt="" width="16" height="16" class="icon-wa shrink-0" loading="lazy"/>
          WhatsApp-Foto senden
        </a>
      </div>
      <div class="mt-10 max-w-xl mx-auto text-left form-panel bg-white text-[color:var(--text-primary)] p-6 md:p-8" id="angebot">
        <p class="text-[11px] font-bold uppercase tracking-[0.12em] text-[color:var(--brand-orange-dark)] m-0">Kurzformular</p>
        <h3 class="mt-2 text-xl font-extrabold text-[color:var(--text-primary)] m-0">Kostenlose Ersteinschätzung</h3>
        <p class="mt-2 text-sm text-[color:var(--text-secondary)] m-0">Name, Telefon, PLZ — wir melden uns rasch.</p>
        <div class="mt-5">
          {% include quote-form.html %}
        </div>
      </div>
    </div>
  </div>
</section>
