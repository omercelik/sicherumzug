<section class="bg-white section-pad defer-section border-y border-gray-100" id="kundenmeinungen">
  <div class="container mx-auto px-4 md:px-6">
    <div class="max-w-3xl mx-auto text-center">
      <p class="section-kicker">Kundenmeinungen</p>
      <h2 class="section-title">Das sagen unsere Kund:innen</h2>
      <p class="section-lede mx-auto">Zufriedene Kunden sind unsere beste Referenz — Fixpreis, Pünktlichkeit und Sorgfalt.</p>
    </div>
    <div class="mt-12 grid gap-6 sm:grid-cols-2 lg:grid-cols-3 max-w-6xl mx-auto">
      {% for testimonial in site.data.testimonials limit:3 %}
      <figure class="flex h-full flex-col justify-between rounded-2xl border border-gray-100 bg-background-light p-7 text-left">
        <div>
          <div class="flex items-center gap-1 text-amber-500" role="img" aria-label="5,0 von 5 Sternen">
            {% for i in (1..5) %}
            <span class="text-lg leading-none" aria-hidden="true">★</span>
            {% endfor %}
          </div>
          <blockquote class="mt-5 text-sm md:text-base text-text-light leading-relaxed m-0">
            <p class="m-0">“{{ testimonial.quote }}”</p>
          </blockquote>
        </div>
        <figcaption class="mt-6 pt-5 border-t border-gray-200 flex items-center gap-3">
          <div class="h-10 w-10 rounded-full bg-primary/10 flex items-center justify-center text-primary font-bold text-sm shrink-0" aria-hidden="true">
            {{ testimonial.name | slice: 0, 1 }}
          </div>
          <div>
            <p class="text-sm font-bold text-primary leading-tight m-0">{{ testimonial.name }}</p>
            <p class="text-xs text-text-muted mt-0.5 m-0">{{ testimonial.role }}</p>
          </div>
        </figcaption>
      </figure>
      {% endfor %}
    </div>
    <div class="mt-10 text-center">
      <a href="{{ '/bewertungen/' | relative_url }}" class="btn-secondary">Alle Bewertungen ansehen</a>
    </div>
  </div>
</section>
